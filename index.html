<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Awakening Essence</title>

    <link rel="stylesheet" href="css/awakening.css">
</head>

<body>

    <main id="game">

        <section id="title-screen" class="screen active">
            <h1>AWAKENING ESSENCE</h1>

            <p class="subtitle">
                The moment your Energy manifests.
            </p>

            <button id="begin-button">BEGIN</button>
        </section>


        <section id="story-screen" class="screen">

            <div id="story-header">
                <h1 id="story-title">THE LIE</h1>
                <p id="act-number"></p>
            </div>

            <article id="story-text"></article>

            <div id="choices"></div>

        </section>


        <section id="result-screen" class="screen">

            <h1>ESSENCE AWAKENED</h1>

            <div id="result-content"></div>

        </section>

    </main>

    <script src="js/awakening.js"></script>

</body>
</html>
