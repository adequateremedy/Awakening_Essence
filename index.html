<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Awakening Essence</title>

    <link
        rel="stylesheet"
        href="css/awakening.css"
    >

</head>


<body>

    <main id="game">


        <!-- =========================================
             AWAKENING ESSENCE — STORY SELECTION
             ========================================= -->

        <section
            id="story-selection-screen"
            class="screen active"
        >

            <img
                id="awakening-intro-image"
                src="assets/Awakening-Essence-Intro.png"
                alt="Awakening Essence"
            >


            <!-- =====================================
                 STORY SELECTION
                 ===================================== -->

            <div id="story-buttons">

                <button
                    class="story-button"
                    data-story="hmss-iron-sovereign"
                    type="button"
                >
                    HMSS IRON SOVEREIGN
                </button>

            </div>

        </section>


        <!-- =========================================
             STORY SCREEN
             ========================================= -->

        <section
            id="story-screen"
            class="screen"
        >

            <div id="story-header">

                <h1 id="story-title"></h1>

            </div>


            <article id="story-text"></article>


            <div id="choices"></div>

        </section>


        <!-- =========================================
             ESSENCE RESULT
             ========================================= -->

        <section
            id="result-screen"
            class="screen"
        >

            <h1>ESSENCE AWAKENED</h1>

            <div id="result-content"></div>

        </section>


    </main>


    <!-- =============================================
         STORY REGISTRY
         =============================================

         This MUST be created before the story files
         are loaded so each story can register itself.
    -->

    <script>
        const awakeningStories = {};
    </script>


    <!-- =============================================
         STORY FILES
         ============================================= -->

    <script src="stories/hmss-iron-sovereign.js"></script>


    <!-- =============================================
         AWAKENING ESSENCE GAME ENGINE
         ============================================= -->

    <script src="js/awakening.js"></script>


</body>

</html>
