<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Awakening Essence</title>

    <link rel="stylesheet" href="css/awakening.css">
</head>

<body>

    <main id="game">

        <!-- =========================================
             AWAKENING ESSENCE INTRO
        ========================================== -->

        <section id="intro-screen" class="screen active">

            <img
                id="awakening-intro-image"
                src="assets/Awakening-Essence-Intro.png"
                alt="Awakening Essence Introduction"
            >

            <button
                id="continue-button"
                class="main-button"
            >
                CONTINUE
            </button>

        </section>


        <!-- =========================================
             STORY SELECTION
        ========================================== -->

        <section id="story-selection-screen" class="screen">

            <h1>CHOOSE YOUR EXPERIENCE</h1>

            <div id="story-buttons">

                <!-- COMPLETED STORY -->

                <button
                    class="story-button"
                    data-story="lie"
                >
                    THE LIE
                </button>


                <!-- STORIES NOT YET COMPLETED -->

                <button
                    class="story-button unavailable"
                    disabled
                >
                    DISRESPECT
                </button>

                <button
                    class="story-button unavailable"
                    disabled
                >
                    NOWHERE BUT HERE
                </button>

                <button
                    class="story-button unavailable"
                    disabled
                >
                    TOO TRUSTING
                </button>

                <button
                    class="story-button unavailable"
                    disabled
                >
                    JUST GONE
                </button>

            </div>

        </section>


        <!-- =========================================
             STORY SCREEN
        ========================================== -->

        <section id="story-screen" class="screen">

            <div id="story-header">

                <h1 id="story-title">
                    THE LIE
                </h1>

                <p id="act-number"></p>

            </div>

            <article id="story-text"></article>

            <div id="choices"></div>

        </section>


        <!-- =========================================
             RESULT SCREEN
        ========================================== -->

        <section id="result-screen" class="screen">

            <h1>ESSENCE AWAKENED</h1>

            <div id="result-content"></div>

        </section>

    </main>


    <script src="js/awakening.js"></script>

</body>
</html>
